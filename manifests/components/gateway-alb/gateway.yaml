# EKS では AWS Load Balancer Controller が Gateway を見て ALB を作る
# #region gateway
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: alb
spec:
  controllerName: gateway.k8s.aws/alb
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: todo-gateway
  namespace: todo-app
spec:
  gatewayClassName: alb
  # ALB の設定は LoadBalancerConfiguration に書く
  infrastructure:
    parametersRef:
      group: gateway.k8s.aws
      kind: LoadBalancerConfiguration
      name: todo-alb
  listeners:
    - name: http
      protocol: HTTP
      port: 80
# #endregion gateway
