apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-db
  namespace: todo-app
  labels:
    app: todo-db
spec:
  replicas: 1
  # DB は同時に2つ動かさない（同じボリュームを2つで書かない）
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: todo-db
  template:
    metadata:
      labels:
        app: todo-db
    spec:
      # #region pod-security
      # postgres の alpine イメージの利用者は UID 70
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      # #endregion pod-security
      containers:
        - name: postgres
          image: postgres:18.6-alpine
          ports:
            - name: postgres
              containerPort: 5432
          # #region env
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: todo-db-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: todo-db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: todo-db-secret
                  key: POSTGRES_PASSWORD
            # ボリュームの直下ではなく1段下にデータを置く
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          # #endregion env
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: todo-db-pvc
