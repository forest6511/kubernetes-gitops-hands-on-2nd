# #region server
# 静的ファイルだけを返す。/api は Gateway（HTTPRoute）が
# todo-api に直接送るので、ここでは中継しない
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok";
    }
}
# #endregion server
